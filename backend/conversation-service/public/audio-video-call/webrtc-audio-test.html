<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Audio Call with Backend Timeout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #fdbb2d;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #fdbb2d;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #startLocal {
            background: #4CAF50;
            color: white;
        }

        #callBtn {
            background: #2196F3;
            color: white;
        }

        #hangupBtn {
            background: #f44336;
            color: white;
        }

        #muteBtn {
            background: #FF9800;
            color: white;
        }

        .status-container {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        #status {
            font-weight: 600;
            color: #fdbb2d;
        }

        .timer {
            font-size: 18px;
            text-align: center;
            margin: 10px 0;
            color: #fdbb2d;
            font-weight: bold;
            display: none;
        }

        .call-info {
            text-align: center;
            margin: 15px 0;
            font-size: 18px;
        }

        .audio-container {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .audio-box {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            width: 45%;
        }

        .audio-label {
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
        }

        .volume-indicator {
            height: 5px;
            background: #4CAF50;
            width: 0%;
            margin-top: 5px;
            border-radius: 5px;
            transition: width 0.1s;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: #f44336;
            color: white;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>WebRTC Audio Call</h1>

        <div class="input-group">
            <label for="myId">Your User ID:</label>
            <input type="text" id="myId" placeholder="Enter your user ID">
        </div>

        <div class="input-group">
            <label for="peerId">Peer User ID:</label>
            <input type="text" id="peerId" placeholder="Enter peer user ID">
        </div>

        <div class="buttons">
            <button id="startLocal">Start Microphone</button>
            <button id="callBtn">Call</button>
            <button id="hangupBtn">Hang Up</button>
            <button id="muteBtn">Mute</button>
        </div>

        <div class="status-container">
            <p>Status: <span id="status">Idle</span></p>
            <div class="timer" id="timer">Call will timeout in 10 seconds</div>
            <div class="call-info" id="callInfo"></div>
        </div>

        <div class="audio-container">
            <div class="audio-box">
                <span class="audio-label">Your Microphone</span>
                <audio id="localAudio" autoplay muted></audio>
                <div class="volume-indicator" id="localVolume"></div>
            </div>
            <div class="audio-box">
                <span class="audio-label">Remote Audio</span>
                <audio id="remoteAudio" autoplay></audio>
                <div class="volume-indicator" id="remoteVolume"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script>
        // DOM elements
        const myIdInput = document.getElementById("myId");
        const peerIdInput = document.getElementById("peerId");
        const startLocalBtn = document.getElementById("startLocal");
        const callBtn = document.getElementById("callBtn");
        const hangupBtn = document.getElementById("hangupBtn");
        const muteBtn = document.getElementById("muteBtn");
        const localAudio = document.getElementById("localAudio");
        const remoteAudio = document.getElementById("remoteAudio");
        const statusEl = document.getElementById("status");
        const timerEl = document.getElementById("timer");
        const callInfoEl = document.getElementById("callInfo");
        const localVolumeEl = document.getElementById("localVolume");
        const remoteVolumeEl = document.getElementById("remoteVolume");
        const toastEl = document.getElementById("toast");

        // WebRTC variables
        let pc = null;
        let localStream = null;
        let isMuted = false;
        let activeCallId = null;
        let callTimeout = null;
        let audioContext = null;
        let localAnalyser = null;
        let remoteAnalyser = null;

        // Socket.io connection - replace with your server URL
        // const socket = io("http://localhost:4022", { autoConnect: true });
        const socket = io("http://89.116.121.48:4022", { autoConnect: true });
        // const socket = io("wss://superapp-event-service.testsdlc.in", { autoConnect: true });

        // WebRTC configuration
        const pcConfig = {
            iceServers: [
                // { urls: ["stun:stun.cloudflare.com:3478", "stun:stun.cloudflare.com:53"] },
                // {
                //     urls: [
                //         "turn:turn.cloudflare.com:3478?transport=udp",
                //         "turn:turn.cloudflare.com:3478?transport=tcp",
                //         "turns:turn.cloudflare.com:5349?transport=tcp",
                //         "turn:turn.cloudflare.com:53?transport=udp",
                //         "turn:turn.cloudflare.com:80?transport=tcp",
                //         "turns:turn.cloudflare.com:443?transport=tcp"
                //     ],
                //     username: "g088b904474f6b35adcd003a245ced43af27607374d51381bee3f6e0e51c0857",
                //     credential: "0245b99a92bc8446c6c210318dac3e8efe1bcee524fce0c1fc9762314858e895"
                // }
                {
                    urls: [
                        "turn:89.116.121.48:3478?transport=udp",
                        "turn:89.116.121.48:3478?transport=tcp",
                        "turns:89.116.121.48:5349?transport=tcp"
                    ],
                    username: "sdlccorp@superapp@eventserverturn",
                    credential: "superappturn1a9k9s7.@sdlccorp.@docker"
                }
            ]
        };

        // Show toast notification
        function showToast(message, isError = true) {
            toastEl.textContent = message;
            toastEl.style.background = isError ? '#f44336' : '#4CAF50';
            toastEl.classList.add('show');

            setTimeout(() => {
                toastEl.classList.remove('show');
            }, 3000);
        }

        // Update status function
        function updateStatus(message) {
            statusEl.textContent = message;
            console.log(message);
        }

        // Initialize audio context for volume indicators
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Setup volume indicator for a stream
        function setupVolumeIndicator(stream, element) {
            if (!stream) return;

            initAudioContext();
            const source = audioContext.createMediaStreamSource(stream);
            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);

            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            function checkVolume() {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (const value of dataArray) {
                    sum += value;
                }
                const average = sum / dataArray.length;
                element.style.width = average + '%';
                requestAnimationFrame(checkVolume);
            }

            checkVolume();
            return analyser;
        }

        // Show/hide timer
        function showTimer() {
            timerEl.style.display = 'block';
        }

        function hideTimer() {
            timerEl.style.display = 'none';
        }

        // Socket event handlers
        socket.on("connect", () => {
            updateStatus("Connected to server: " + socket.id);
            showToast("Connected to signaling server", false);
        });

        socket.on("disconnect", () => {
            updateStatus("Disconnected from server");
            showToast("Disconnected from server");
        });

        // Initialize microphone
        startLocalBtn.onclick = async () => {
            const myId = myIdInput.value.trim();
            if (!myId) return showToast("Please enter your user ID first");

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        sampleRate: 44100
                    }
                });
                localAudio.srcObject = localStream;
                socket.emit("registerUser", { senderId: myId });
                updateStatus("Microphone started & registered as " + myId);
                showToast("Microphone activated", false);

                // Setup local volume indicator
                localAnalyser = setupVolumeIndicator(localStream, localVolumeEl);
            } catch (error) {
                console.error("Error accessing microphone:", error);
                updateStatus("Error accessing microphone");
                showToast("Could not access your microphone. Please check permissions.");
            }
        };

        // Create peer connection
        function createPeerConnection(peerId) {
            pc = new RTCPeerConnection(pcConfig);

            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    socket.emit("call:ice-candidate", { to: peerId, candidate: e.candidate });
                }
            };

            pc.onconnectionstatechange = () => {
                updateStatus("Connection state: " + pc.connectionState);
                if (pc.connectionState === "connected") {
                    hideTimer();
                    callInfoEl.textContent = `In call with ${peerId}`;
                    showToast("Call connected", false);

                    // Setup remote volume indicator
                    if (remoteAudio.srcObject) {
                        remoteAnalyser = setupVolumeIndicator(remoteAudio.srcObject, remoteVolumeEl);
                    }

                    // Tell server the call is connected
                    socket.emit("call:connected", {
                        callId: activeCallId,
                        callerId: myIdInput.value.trim(),
                        receiverId: peerIdInput.value.trim(),
                    });
                } else if (pc.connectionState === "disconnected" ||
                    pc.connectionState === "failed" ||
                    pc.connectionState === "closed") {
                    hideTimer();
                    callInfoEl.textContent = "";
                }
            };

            pc.ontrack = (e) => {
                remoteAudio.srcObject = e.streams[0];
                remoteAudio.play().catch(() => { });
            };

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }
        }

        // Initiate call
        callBtn.onclick = async () => {
            const to = peerIdInput.value.trim();
            const from = myIdInput.value.trim();
            if (!to || !from) return showToast("Please enter both your ID and peer ID");
            if (!localStream) return showToast("Please start your microphone first");

            createPeerConnection(to);
            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                socket.emit("call:offer", { to, from, offer });
                activeCallId = null; // Will be set when callee receives offer
                updateStatus("Calling " + to + "...");
                callInfoEl.textContent = `Calling ${to}...`;
                showTimer();
            } catch (error) {
                console.error("Error creating offer:", error);
                updateStatus("Error making call");
                showToast("Error making call");
            }
        };

        // Hang up call
        hangupBtn.onclick = () => {
            hideTimer();
            if (pc) {
                pc.close();
                pc = null;
            }
            socket.emit("call:end", {
                to: peerIdInput.value.trim(),
                from: myIdInput.value.trim(),
                callId: activeCallId,
            });
            updateStatus("Call ended");
            activeCallId = null;
            callInfoEl.textContent = "";
            showToast("Call ended", false);
        };

        // Mute/unmute
        muteBtn.onclick = () => {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
            muteBtn.textContent = isMuted ? "Unmute" : "Mute";
            updateStatus(isMuted ? "Microphone muted" : "Microphone unmuted");
            showToast(isMuted ? "Microphone muted" : "Microphone unmuted", false);
        };

        // Incoming call offer
        socket.on("call:offer", async ({ from, offer, callId }) => {
            activeCallId = callId;
            callInfoEl.textContent = `Incoming call from ${from}`;
            showTimer();

            const accept = confirm(`Incoming call from ${from}. Accept?`);
            if (!accept) {
                socket.emit("call:reject", { to: from, from: myIdInput.value.trim(), callId });
                callInfoEl.textContent = "";
                hideTimer();
                return;
            }

            createPeerConnection(from);
            try {
                await pc.setRemoteDescription(offer);
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                socket.emit("call:answer", { to: from, from: myIdInput.value.trim(), answer, callId });
                updateStatus("Answered call from " + from);
                callInfoEl.textContent = `In call with ${from}`;
                showToast("Call answered", false);
            } catch (error) {
                console.error("Error answering call:", error);
                updateStatus("Error answering call");
                showToast("Error answering call");
            }
        });

        // Incoming answer
        socket.on("call:answer", async ({ from, answer, callId }) => {
            activeCallId = callId || activeCallId;
            hideTimer();
            try {
                await pc.setRemoteDescription(answer);
                updateStatus("Call connected with " + from);
            } catch (error) {
                console.error("Error setting remote description:", error);
                updateStatus("Error connecting call");
                showToast("Error connecting call");
            }
        });

        // Incoming ICE candidate
        socket.on("call:ice-candidate", async ({ candidate }) => {
            if (candidate && pc) {
                try {
                    await pc.addIceCandidate(candidate);
                } catch (error) {
                    console.error("Error adding ICE candidate:", error);
                }
            }
        });

        // Call ended remotely
        socket.on("call:end", ({ from, callId }) => {
            hideTimer();
            if (pc) {
                pc.close();
                pc = null;
            }
            updateStatus("Call ended by " + from);
            activeCallId = null;
            callInfoEl.textContent = "";
            showToast(`Call ended by ${from}`);
        });

        // Call rejected
        socket.on("call:reject", ({ from, callId }) => {
            hideTimer();
            if (pc) {
                pc.close();
                pc = null;
            }
            updateStatus("Call rejected by " + from);
            activeCallId = null;
            callInfoEl.textContent = "";
            showToast(`${from} rejected your call`);
        });

        // User unavailable
        socket.on("call:unavailable", ({ to, callId }) => {
            activeCallId = callId || activeCallId;
            hideTimer();
            updateStatus(`User ${to} is not available`);
            callInfoEl.textContent = "";
            showToast(`User ${to} is not available`);
        });

        // Call timeout from backend
        socket.on("call:timeout", ({ callId }) => {
            hideTimer();
            if (pc) {
                pc.close();
                pc = null;
            }
            updateStatus("Call timed out");
            activeCallId = null;
            callInfoEl.textContent = "";
            showToast("Call timed out - not answered in time");
        });

        // Handle page refresh/close
        window.addEventListener('beforeunload', () => {
            if (pc) {
                socket.emit("call:end", {
                    to: peerIdInput.value.trim(),
                    from: myIdInput.value.trim(),
                    callId: activeCallId,
                });
            }
        });
    </script>
</body>

</html>
