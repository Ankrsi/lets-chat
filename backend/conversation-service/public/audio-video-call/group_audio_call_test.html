<html>

<head>
  <meta charset="utf-8" />
  <title>Group Audio Call</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body {
      font-family: Arial;
      padding: 12px;
    }

    input {
      width: 260px;
    }

    pre {
      background: #111;
      color: #0f0;
      padding: 8px;
      height: 260px;
      overflow: auto;
    }

    .remote {
      margin: 8px 0;
    }
  </style>
</head>

<body>
  <h2>Audio Call</h2>

  <div>
    <label>Your ID: <input id="myId" placeholder="e.g. 9198..." /></label><br />
    <label>Call To: <input id="targetId" placeholder="target user id" /></label><br />
    <button id="registerBtn">Register & Enable Mic</button>
    <button id="callBtn">Call</button>
    <button id="pickBtn" disabled>Pick Incoming</button>
    <button id="endBtn">End Call</button>
  </div>

  <hr />
  <div>
    <label>Add user to ongoing call: <input id="newUserId" placeholder="new user id" /></label>
    <button id="addUserBtn">Add User</button>
  </div>

  <h4>Remote Streams</h4>
  <div id="remoteList"></div>

  <h4>Logs</h4>
  <pre id="logs"></pre>

  <script>
    (async () => {
      // CONFIG - update SOCKET_URL if needed
      const SOCKET_URL = "http://localhost:4022";
      const rtcConfig = {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          {
            urls: [
              "turn:89.116.121.48:3478?transport=udp",
              "turn:89.116.121.48:3478?transport=tcp",
              "turns:89.116.121.48:5349?transport=tcp"
            ],
            username: "sdlccorp@superapp@eventserverturn",
            credential: "superappturn1a9k9s7.@sdlccorp.@docker"
          }
        ]
      };

      const logs = document.getElementById("logs");
      const myIdEl = document.getElementById("myId");
      const targetIdEl = document.getElementById("targetId");
      const registerBtn = document.getElementById("registerBtn");
      const callBtn = document.getElementById("callBtn");
      const pickBtn = document.getElementById("pickBtn");
      const endBtn = document.getElementById("endBtn");
      const addUserBtn = document.getElementById("addUserBtn");
      const newUserIdEl = document.getElementById("newUserId");
      const remoteList = document.getElementById("remoteList");

      function log(msg) {
        const t = new Date().toLocaleTimeString();
        logs.textContent += `[${t}] ${msg}\n`;
        logs.scrollTop = logs.scrollHeight;
        console.log(msg);
      }

      const socket = io(SOCKET_URL, { transports: ["websocket"], auth: { token: localStorage.getItem("token") } });

      // Local state
      let localStream = null;
      let currentCallId = null;
      let pendingOffers = [];
      let conversationId = null;

      // peers: uid -> { pc: RTCPeerConnection, pendingCandidates: [], audioEl }
      const peers = {};

      async function ensureLocalStream() {
        if (!localStream) {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          log("Got microphone stream");
        }
        return localStream;
      }

      function makeAudioElement(remoteId) {
        const wrapper = document.createElement("div");
        wrapper.className = "remote";
        wrapper.id = `wrapper-${remoteId}`;
        const label = document.createElement("div");
        label.textContent = `Remote: ${remoteId}`;
        const audio = document.createElement("audio");
        audio.autoplay = true;
        audio.controls = true;
        audio.id = `audio-${remoteId}`;
        wrapper.appendChild(label);
        wrapper.appendChild(audio);
        remoteList.appendChild(wrapper);
        return audio;
      }

      function cleanupPeer(remoteId) {
        const entry = peers[remoteId];
        if (!entry) return;
        try { entry.pc.close(); } catch { }
        if (entry.audioEl) {
          entry.audioEl.srcObject = null;
          const w = document.getElementById(`wrapper-${remoteId}`);
          if (w) w.remove();
        }
        delete peers[remoteId];
        log(`Cleaned up peer ${remoteId}`);
      }

      function createPeer(remoteId) {
        // create pc if not exists and return pc
        if (peers[remoteId] && peers[remoteId].pc) return peers[remoteId].pc;

        const pc = new RTCPeerConnection(rtcConfig);
        peers[remoteId] = { pc, pendingCandidates: [], audioEl: null };

        // attach local tracks (if present)
        if (localStream) {
          for (const t of localStream.getTracks()) {
            try { pc.addTrack(t, localStream); } catch (e) { console.warn("addTrack failed", e); }
          }
        } else {
          log("Warning: localStream not available when creating PC for " + remoteId);
        }

        pc.ontrack = (ev) => {
          log(`ontrack from ${remoteId}`);
          if (!peers[remoteId].audioEl) peers[remoteId].audioEl = makeAudioElement(remoteId);
          peers[remoteId].audioEl.srcObject = ev.streams[0];
        };

        pc.onicecandidate = (e) => {
          if (!e.candidate) return;
          socket.emit("call:ice-candidate", {
            callId: currentCallId,
            from: myIdEl.value?.trim(),
            to: remoteId,
            candidate: e.candidate
          });
        };

        pc.onconnectionstatechange = () => {
          log(`PC[${remoteId}] state: ${pc.connectionState}`);
          if (["failed", "disconnected", "closed"].includes(pc.connectionState)) cleanupPeer(remoteId);
        };

        return pc;
      }

      async function applyBufferedCandidates(remoteId) {
        const ent = peers[remoteId];
        if (!ent || !ent.pc) return;
        while (ent.pendingCandidates && ent.pendingCandidates.length) {
          const c = ent.pendingCandidates.shift();
          try {
            await ent.pc.addIceCandidate(new RTCIceCandidate(c));
            log(`Added buffered ICE for ${remoteId}`);
          } catch (err) {
            console.error("addIceCandidate error", err);
          }
        }
      }

      // UI actions
      registerBtn.onclick = async () => {
        const my = myIdEl.value?.trim();
        if (!my) return alert("Enter your ID");
        socket.emit("registerUser", { senderId: my });
        log("Registered as " + my);
        try { await ensureLocalStream(); } catch (e) { log("getUserMedia failed: " + e); }
      };

      callBtn.onclick = async () => {
        const from = myIdEl.value?.trim();
        const to = targetIdEl.value?.trim();
        if (!from || !to) return alert("Enter both IDs");
        await ensureLocalStream();
        currentCallId = null;
        const pc = createPeer(to);
        // ensure local tracks are added
        localStream.getTracks().forEach(t => { try { pc.addTrack(t, localStream); } catch (e) { } });
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        // emit initial call offer to callee (server will route)
        socket.emit("call:offer", { from, to, offer, conversationId: "68c9271100daf7ba1ae4eb4a" });
        log(`Sent call:offer -> ${to}`);
      };

      // pick incoming (initial offer or add-user offer)
      pickBtn.onclick = async () => {
        if (pendingOffers.length === 0) return;
        await ensureLocalStream();

        for (const incoming of pendingOffers) {
          const { callId, offer, from, offerType } = incoming;
          if (!currentCallId) currentCallId = callId;
          if (offerType == "initial") {
            const pc = createPeer(from);
            await pc.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            // initial call answer back to caller
            socket.emit("call:answer", { callId, from: myIdEl.value?.trim(), to: from, answer });
            log(`Sent call:answer -> ${from}`);
            // stop timer and notify connect
            socket.emit("call:stopTimer", { callId });
            socket.emit("call:connect", { callId, from: myIdEl.value?.trim(), to: from });
            await applyBufferedCandidates(from);
          }
          if (offerType == "addUser") {
            try {
              socket.emit("call:add-user-accept", { callId, newUser: myIdEl.value?.trim(), from });
            } catch (err) {
              console.error("Error handling add-offer", err);
            }
          }
        }
        pickBtn.disabled = true;
        pendingOffers = [];
      };

      endBtn.onclick = () => {
        Object.keys(peers).forEach(k => cleanupPeer(k));
        try { localStream && localStream.getTracks().forEach(t => t.stop()); } catch { }
        localStream = null;
        if (currentCallId) socket.emit("call:end", { callId: currentCallId, from: myIdEl.value?.trim() });
        currentCallId = null;
        log("Call ended locally");
      };

      // Invite new user (inviter)
      addUserBtn.onclick = async () => {
        const from = myIdEl.value?.trim();
        const newUser = newUserIdEl.value?.trim();
        if (!from || !newUser || !currentCallId) return alert("Join/accept a call first, and enter new user id");
        // notify backend to add user to call
        socket.emit("call:add-user", { callId: currentCallId, from, newUser });
      };

      // --- Socket listeners ---
      socket.on("connect", () => log("socket connected: " + socket.id));
      socket.on("disconnect", () => log("socket disconnected"));

      socket.on("call:call-details", ({ callId, from, to }) => {
        currentCallId = callId;
        log(`call:call-details received callId=${callId}`);
      });

      // incoming (initial) - server forwarded call:incoming
      socket.on("call:incoming", ({ callId, from, to, offer, conversationId, offerType }) => {
        log(`call:incoming from=${from} callId=${callId} offerType=${offerType || 'initial'}`);
        pendingOffers.push({ callId, offer, from, offerType });
        currentCallId = callId;
        conversationId = conversationId;
        pickBtn.disabled = false;
      });

      // add incoming (initial) - server forwarded call:add-incoming
      socket.on("call:add-incoming", ({ callId, from, newUser, offerType }) => {
        pendingOffers.push({ callId, from, offerType });
        currentCallId = callId;
        pickBtn.disabled = false;
      });

      // add call accepted
      socket.on("call:add-incoming-accepted", async ({ callId, from, newUser }) => {
        // send the offer to new user via backend routing
        if (!from || !newUser || !currentCallId) return alert("Join/accept a call first, and enter new user id");
        await ensureLocalStream();
        // create PC for the new user
        const pc = createPeer(newUser);
        // add local tracks
        localStream.getTracks().forEach(t => { try { pc.addTrack(t, localStream); } catch (e) { } });

        // create offer and set local description
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit("call:add-offer", { callId: currentCallId, from, to: newUser, offer });
        log(`Invited ${newUser} to callId ${currentCallId} (sent add-offer)`);
      });

      // when a remote answers our initial offer
      socket.on("call:answer", async ({ callId, from, answer }) => {
        log(`call:answer from=${from} callId=${callId}`);
        const ent = peers[from];
        if (!ent || !ent.pc) return log("No peer found for answer from " + from);
        try {
          await ent.pc.setRemoteDescription(new RTCSessionDescription(answer));
          log("Applied remote answer for " + from);
          await applyBufferedCandidates(from);
        } catch (err) {
          console.error("Error applying answer", err);
        }
      });

      // add-answer: response from invited participant (inviter receives this)
      socket.on("call:add-answer", async ({ callId, from, answer }) => {
        log(`call:add-answer from=${from} callId=${callId}`);
        const ent = peers[from];
        if (!ent || !ent.pc) {
          log("No peer entry for add-answer from " + from);
          return;
        }
        try {
          await ent.pc.setRemoteDescription(new RTCSessionDescription(answer));
          log("Set remote desc (add-answer) for " + from);
          await applyBufferedCandidates(from);
        } catch (e) {
          console.error("Error setting add-answer remote desc", e);
        }
      });

      // add-offer: received when someone invited me (new user)
      socket.on("call:add-offer", async ({ callId, from, to, offer, offerType }) => {
        currentCallId = callId;
        const pc = createPeer(from);
        await pc.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        socket.emit("call:add-answer", { callId, from: myIdEl.value?.trim(), to: from, answer });
        await applyBufferedCandidates(from);
      });

      // ICE candidate targeted at us from another peer
      socket.on("call:ice-candidate", async ({ callId, from, candidate }) => {
        if (!from || !candidate) return;
        if (!peers[from]) {
          // create placeholder entry so we buffer until pc created
          peers[from] = { pc: null, pendingCandidates: [], audioEl: null };
        }
        const ent = peers[from];
        if (!ent.pc) {
          ent.pendingCandidates.push(candidate);
          log(`Buffered ICE candidate for ${from} (pc not ready)`);
          return;
        }
        if (!ent.pc.remoteDescription || !ent.pc.remoteDescription.type) {
          ent.pendingCandidates.push(candidate);
          log(`Buffered ICE candidate for ${from} (remoteDesc missing)`);
          return;
        }
        try {
          await ent.pc.addIceCandidate(new RTCIceCandidate(candidate));
          log(`Added ICE candidate from ${from}`);
        } catch (e) {
          console.error("Error adding ICE candidate", e);
        }
      });

      // server tells new user who are existing participants (invited user receives this)
      socket.on("call:existing-participants", async ({ callId, participants }) => {
        currentCallId = callId;
        for (const p of participants) {
          if (p === myIdEl.value?.trim()) continue;
          const pc = createPeer(p);
          await ensureLocalStream();
          localStream.getTracks().forEach(t => { try { pc.addTrack(t, localStream); } catch (e) { } });

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          socket.emit("call:add-offer", { callId, from: myIdEl.value?.trim(), to: p, offer });
          log(`(newUser) Sent add-offer -> ${p}`);
        }
      });

      socket.on("call:new-participant", async ({ callId, userId, from }) => {
        log(`New participant joined: ${userId} (invited by ${from})`);
        createPeer(userId);
      });

      socket.on("call:user-left", ({ userId }) => {
        log(`${userId} left the call.`);
        cleanupPeer(userId);
      });

      socket.on("call:connected", ({ callId, from, to }) => {
        log(`call connected ${from} <-> ${to} (callId=${callId})`);
      });

      socket.on("call:ended", ({ callId, from, reason }) => {
        log(`call ended by ${from} reason=${reason}`);
        Object.keys(peers).forEach(k => cleanupPeer(k));
        currentCallId = null;
      });

      socket.on("call:unavailable", ({ callId, to }) => {
        log(`call:unavailable ${to} (callId=${callId})`);
      });

      // cleanup on page close
      window.addEventListener("beforeunload", () => {
        Object.keys(peers).forEach(k => cleanupPeer(k));
        try { socket.disconnect(); } catch { }
      });
    })();
  </script>
</body>

</html>
