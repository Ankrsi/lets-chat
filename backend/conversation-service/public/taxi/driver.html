<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Driver Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    :root {
      --bg:#0f172a; --panel:#111827; --muted:#9ca3af; --text:#e5e7eb;
      --primary:#3b82f6; --primary-600:#2563eb; --danger:#ef4444; --danger-600:#dc2626;
      --success:#22c55e; --card:#0b1220; --shadow:rgba(0,0,0,0.35);
      --radius:14px; --radius-sm:10px;
    }
    *{box-sizing:border-box;}
    body{margin:0;padding:24px;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto; color:var(--text);
      background: radial-gradient(1200px 600px at 20% -10%, #1e293b 0%, var(--bg) 45%),
                  radial-gradient(800px 600px at 110% 10%, #0b1220 0%, var(--bg) 55%);
      display:grid; place-items:start center;
    }
    .wrap{width:100%; max-width:920px;}
    header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
    h1{margin:0; font-size:clamp(20px,2.2vw,28px);}
    .status{padding:10px 14px;border-radius:999px;font-size:14px;background:#0a1324;border:1px solid #14213d;color:var(--muted);}
    .status.success{color:#86efac;border-color:#14532d;background:#052e1a;}
    .status.warn{color:#fde68a;border-color:#7c2d12;background:#2a1005;}
    .status.error{color:#fecaca;border-color:#7f1d1d;background:#2a0b0b;}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(0,0,0,0.15)),var(--card);border:1px solid rgba(148,163,184,0.12);border-radius:var(--radius);box-shadow:0 20px 50px var(--shadow);padding:18px;}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
    button{appearance:none;border:none;outline:none;cursor:pointer;padding:12px 18px;border-radius:var(--radius-sm);font-weight:600;color:#fff;transition:all .2s;box-shadow:0 8px 20px rgba(0,0,0,0.25), inset 0 0 0 1 rgba(255,255,255,.06);}
    button:active{transform:translateY(1px);}
    button:disabled{opacity:.6;cursor:not-allowed;}
    .btn-primary{background:var(--primary);}
    .btn-primary:hover{background:var(--primary-600);}
    .btn-danger{background:var(--danger);}
    .btn-danger:hover{background:var(--danger-600);}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    @media (max-width:780px){.grid{grid-template-columns:1fr;}}
    .stat{background:rgba(2,6,23,0.5);border:1px solid rgba(148,163,184,0.12);border-radius:var(--radius-sm);padding:14px;}
    .label{font-size:12px;color:var(--muted);text-transform:uppercase;}
    .value{font-size:clamp(16px,2.5vw,20px);margin-top:6px;word-break:break-word;}
    .footer{display:flex;gap:10px;align-items:center;color:var(--muted);margin-top:10px;font-size:13px;}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Driver Panel</h1>
      <div id="status" class="status">Initializing…</div>
    </header>

    <div class="card">
      <div class="actions">
        <button id="sendLocation" class="btn-primary">Send Location</button>
        <button id="stopLocation" class="btn-danger">Stop Location Updates</button>
        <button id="testCancelRide" class="btn-danger" style="margin-left:auto;">Test Cancel Ride</button>
      </div>

      <div class="grid">
        <div class="stat">
          <div class="label">Driver Name</div>
          <div id="driverName" class="value">-</div>
        </div>
        <div class="stat">
          <div class="label">Vehicle</div>
          <div id="vehicleInfo" class="value">-</div>
        </div>
        <div class="stat">
          <div class="label">Latitude</div>
          <div id="lat" class="value">-</div>
        </div>
        <div class="stat">
          <div class="label">Longitude</div>
          <div id="lng" class="value">-</div>
        </div>
        <div class="stat">
          <div class="label">Timestamp</div>
          <div id="time" class="value">-</div>
        </div>
        <div class="stat">
          <div class="label">Update Count</div>
          <div id="counter" class="value">0</div>
        </div>
      </div>

      <div class="footer">
        <span>Ride ID:</span><span id="rideIdBadge">68d3c88f37c5cb00f4dad62e</span>
      </div>
    </div>
  </div>

<script>
const socket = io("http://localhost:4022", { transports: ["websocket"] });
const rideId = "68d3c88f37c5cb00f4dad62e";

const statusEl = document.getElementById("status");
const latEl = document.getElementById("lat");
const lngEl = document.getElementById("lng");
const timeEl = document.getElementById("time");
const counterEl = document.getElementById("counter");
const rideIdBadge = document.getElementById("rideIdBadge");
const driverNameEl = document.getElementById("driverName");
const vehicleInfoEl = document.getElementById("vehicleInfo");
const btnSend = document.getElementById("sendLocation");
const btnStop = document.getElementById("stopLocation");
const btnTestCancel = document.getElementById("testCancelRide");

// Driver Info
const driverInfo = {
  first_name: "mahesh",
  last_name: "more",
  // profile_image: "https://appsuper-bucket.s3.ap-south-1.amazonaws.com/profile-images/1758003645209-download%20%281%29.jpg",
  phone: 919022281011,
  vehicle_type: "sedan",
  brand: "Toyota",
  model: "Etios",
  color: "White",
  vehicle_number: "MH20PRE004",
  manufacturing_year: 2021,
  capacity: 4
};

driverNameEl.textContent = `${driverInfo.first_name} ${driverInfo.last_name}`;
vehicleInfoEl.textContent = `${driverInfo.brand} ${driverInfo.model} - ${driverInfo.vehicle_number}`;
rideIdBadge.textContent = rideId;

function setStatus(text,type="neutral"){ 
  statusEl.textContent=text; 
  statusEl.className="status"; 
  if(type==="success")statusEl.classList.add("success");
  if(type==="warn")statusEl.classList.add("warn");
  if(type==="error")statusEl.classList.add("error");
}

let lat=9.5754717, lng=-13.6198829, counter=0;
const encodedRoute="atsmDezfvMBgAT?d@?xBFtB@V?TFLc@nAgC\\y@~@qBfA}B...";

function sendLocation(){
  counter++;
  const locationData={
    driverId:"driver123",
    rideId,
    lat:lat+Math.random()*0.01,
    lng:lng+Math.random()*0.01,
    encodedPolyline:encodedRoute,
    timestamp:new Date().toISOString(),
    counter,
    driverInfo
  };
  socket.emit("locationUpdateFromDriver",locationData);

  latEl.textContent=locationData.lat.toFixed(6);
  lngEl.textContent=locationData.lng.toFixed(6);
  timeEl.textContent=new Date(locationData.timestamp).toLocaleTimeString();
  counterEl.textContent=String(counter);
}

let updateInterval=setInterval(sendLocation,3000);

btnSend.addEventListener("click",sendLocation);
btnStop.addEventListener("click",()=>{
  if(updateInterval){clearInterval(updateInterval);updateInterval=null;}
  btnStop.disabled=true;
  setStatus("Location updates stopped by driver.","warn");
});

btnTestCancel.addEventListener("click",()=>{
  const reason="Test cancellation";
  socket.emit("driverCanceledRide",{rideId,reason});
  if(updateInterval){clearInterval(updateInterval);updateInterval=null;}
  setStatus("Driver sent test cancellation.","warn");
  alert("Test cancellation event emitted.");
});

socket.on("connect",()=>{ 
  socket.emit("subscribe",{rideId});
  setStatus("Connected and subscribed to ride.","success");
});

socket.on("rideCanceledByPassenger",(data)=>{
  if(updateInterval){clearInterval(updateInterval);updateInterval=null;}
  btnStop.disabled=true; btnSend.disabled=true;
  setStatus(data?.message || "Passenger canceled the ride.","error");
  alert(data?.message || "Passenger canceled the ride.");
  socket.emit("unsubscribe",{rideId});
  latEl.textContent="-"; lngEl.textContent="-"; timeEl.textContent="-"; counterEl.textContent="0";
});

socket.on("disconnect",()=>{setStatus("Disconnected.","error");});
</script>
</body>
</html>
