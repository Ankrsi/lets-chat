<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pool Ride Driver Dashboard</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
.dashboard { max-width: 900px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
.section { margin-bottom: 20px; }
.input-group { display: flex; flex-wrap: wrap; gap: 10px; }
input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
button:hover { background: #0056b3; }
button:disabled { background: #ccc; cursor: not-allowed; }
.logs { background: #f8f9fa; padding: 10px; border-radius: 4px; max-height: 250px; overflow-y: auto; font-size: 14px; }
.live { background: #e9ffe9; padding: 15px; border-radius: 8px; font-weight: bold; color: #28a745; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="dashboard">
  <h1>🚕 Pool Ride Driver Dashboard</h1>

  <!-- Join Ride -->
  <div class="section">
    <h2>Join Pool Ride</h2>
    <div class="input-group">
      <label>Pool Ride ID: <input id="poolRideId" value="POOL1234"></label>
      <label>Driver ID: <input id="driverId" value="DRV001"></label>
      <button onclick="joinPoolRide()">Join Ride</button>
    </div>
  </div>

  <!-- Driver Status -->
  <div class="section">
    <h2>Driver Control</h2>
    <div class="input-group">
      <label>Driver Status:
        <select id="driverStatus">
          <option value="idle">idle</option>
          <option value="started">started</option>
          <option value="completed">completed</option>
        </select>
      </label>
    </div>
  </div>

  <!-- Coordinates + Passenger Info -->
  <div class="section">
    <h2>Send Coordinates</h2>
    <div class="input-group">
      <label>Lat: <input id="lat" value="19.876"></label>
      <label>Lng: <input id="lng" value="75.345"></label>
    </div>

    <h3>Passengers</h3>
    <div class="input-group">
      <label>P1 ID: <input id="p1Id" value="P001"></label>
      <label>P1 Status:
        <select id="p1Status">
          <option value="waiting">waiting</option>
          <option value="onboard">onboard</option>
          <option value="dropped">dropped</option>
        </select>
      </label>

      <label>P2 ID: <input id="p2Id" value="P002"></label>
      <label>P2 Status:
        <select id="p2Status">
          <option value="waiting">waiting</option>
          <option value="onboard">onboard</option>
          <option value="dropped">dropped</option>
        </select>
      </label>
    </div>

    <button id="sendBtn" onclick="sendUpdate()">Send Manual Update</button>
    <button id="autoBtn" onclick="toggleAutoSend()">Start Auto-Send (5s)</button>
  </div>

  <!-- Live Updates -->
  <div class="section">
    <h2>📡 Live Pool Ride Updates</h2>
    <div id="liveData" class="live">Waiting for updates...</div>
  </div>

  <!-- Logs -->
  <div class="section">
    <h2>Logs</h2>
    <div id="logs" class="logs"></div>
    <button onclick="clearLogs()">Clear Logs</button>
  </div>
</div>

<script>
const socket = io('http://localhost:4022'); // ✅ Change backend URL if needed
let autoSendInterval = null, sentCount = 0;

socket.on('connect', () => log('✅ Connected to server'));

// 🔄 Listen for live ride updates
socket.on('rideStream', (data) => {
  updateLiveData(data);
  log(`📩 Live rideStream → ${JSON.stringify(data)}`);
});

function joinPoolRide() {
  const poolRideId = document.getElementById('poolRideId').value;
  socket.emit('joinPoolRide', poolRideId);
  log(`🚗 Joined pool ride room: ${poolRideId}`);
}

// 🧾 Build payload
function getPayload() {
  const poolRideId = document.getElementById('poolRideId').value;
  const driverId = document.getElementById('driverId').value;
  const driverStatus = document.getElementById('driverStatus').value;
  const lat = parseFloat(document.getElementById('lat').value);
  const lng = parseFloat(document.getElementById('lng').value);

  const passengers = [
    {
      passengerId: document.getElementById('p1Id').value,
      status: document.getElementById('p1Status').value,
    },
    {
      passengerId: document.getElementById('p2Id').value,
      status: document.getElementById('p2Status').value,
    }
  ];

  return {
    poolRideId,
    driverId,
    driverStatus, // ✅ new field added here
    coordinates: { lat, lng },
    timestamp: Date.now(),
    passengers,
  };
}

// 🚀 Send single coordinate
function sendUpdate() {
  const data = getPayload();
  socket.emit('poolRideCoordinateUpdate', data);
  sentCount++;
  log(`📤 Sent #${sentCount} → ${JSON.stringify(data)}`);

  // simulate movement
  document.getElementById('lat').value = (parseFloat(document.getElementById('lat').value) + 0.001).toFixed(6);
  document.getElementById('lng').value = (parseFloat(document.getElementById('lng').value) + 0.001).toFixed(6);
}

// ▶️ Toggle auto-send (5s)
function toggleAutoSend() {
  if (autoSendInterval) {
    clearInterval(autoSendInterval);
    autoSendInterval = null;
    document.getElementById("autoBtn").innerText = "Start Auto-Send (5s)";
    log("⏹️ Auto-send stopped");
  } else {
    sendUpdate();
    autoSendInterval = setInterval(sendUpdate, 5000);
    document.getElementById("autoBtn").innerText = "Stop Auto-Send";
    log("▶️ Auto-send started (every 5s)");
  }
}

// 🟢 Update live data display
function updateLiveData(data) {
  const html = `
    <b>Pool Ride:</b> ${data.poolRideId}<br>
    <b>Driver:</b> ${data.driverId}<br>
    <b>Driver Status:</b> ${data.driverStatus || 'unknown'}<br>
    <b>Coordinates:</b> ${data.coordinates.lat}, ${data.coordinates.lng}<br>
    <b>Passengers:</b>
    <ul>
      ${data.passengers.map(p => `<li>${p.passengerId} → ${p.status}</li>`).join('')}
    </ul>
    <b>Timestamp:</b> ${new Date(data.timestamp).toLocaleTimeString()}
  `;
  document.getElementById('liveData').innerHTML = html;
}

// 🧾 Logger
function log(msg) {
  const logs = document.getElementById('logs');
  logs.innerHTML += `<p>${new Date().toLocaleTimeString()} → ${msg}</p>`;
  logs.scrollTop = logs.scrollHeight;
}

function clearLogs() {
  document.getElementById('logs').innerHTML = '';
}
</script>
</body>
</html>
