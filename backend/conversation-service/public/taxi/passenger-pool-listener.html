<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Passenger Pool Ride Listener</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <div class="max-w-3xl mx-auto p-4 md:p-6">
    <header class="flex items-center justify-between mb-4">
      <h1 class="text-xl md:text-2xl font-semibold">🧍 Passenger Pool Ride Listener</h1>
      <div id="connBadge" class="inline-flex items-center gap-2 rounded-full px-3 py-1 text-sm bg-slate-200 text-slate-700">
        <span class="inline-block h-2 w-2 rounded-full bg-slate-400"></span>
        Disconnected
      </div>
    </header>

    <section class="bg-white shadow-sm rounded-xl border border-slate-200">
      <div class="p-4 border-b border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-3">
        <div class="md:col-span-2">
          <label class="block text-sm font-medium mb-1">Request ID</label>
          <input id="requestId" value="REQ123" class="w-full border rounded-lg px-3 py-2" />
        </div>
        <div class="flex items-end">
          <button id="joinBtn" class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 w-full">Join Room</button>
        </div>
      </div>

      <div class="p-4 border-t border-slate-200">
        <h2 class="font-medium mb-2">Incoming Events</h2>
        <div id="logs" class="h-80 overflow-auto border rounded-lg bg-slate-50 p-3 text-sm"></div>
      </div>
    </section>
  </div>

  <script>
    const socket = io("http://localhost:4022", { transports: ["websocket"] });
    const logs = document.getElementById("logs");
    const connBadge = document.getElementById("connBadge");

    function log(msg, color="text-slate-700") {
      logs.innerHTML += `<div class="${color}">${new Date().toLocaleTimeString()} → ${msg}</div>`;
      logs.scrollTop = logs.scrollHeight;
    }

    socket.on("connect", () => {
      connBadge.innerHTML = "🟢 Connected";
      log(`Connected with ID: ${socket.id}`, "text-emerald-700");
    });

    socket.on("disconnect", () => {
      connBadge.innerHTML = "🔴 Disconnected";
      log("Disconnected", "text-rose-700");
    });

    document.getElementById("joinBtn").addEventListener("click", () => {
      const requestId = document.getElementById("requestId").value.trim();
      socket.emit("joinPoolRequest", { requestId });
      log(`🧍 Joined room → ${requestId}`, "text-emerald-700");
    });

    socket.on("poolRideUpdate", (data) => {
      log(`📩 Received poolRideUpdate → ${JSON.stringify(data)}`, "text-indigo-700");
    });
  </script>
</body>
</html>
