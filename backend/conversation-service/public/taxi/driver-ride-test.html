<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Ride Test</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; }
    fieldset { margin-bottom: 12px; }
    label { display: inline-block; width: 140px; }
    input, select { padding: 6px; margin: 4px 0; width: 260px; }
    button { margin-right: 8px; margin-bottom: 8px; }
    #log { white-space: pre-wrap; background: #111; color: #0f0; padding: 12px; height: 320px; overflow: auto; }
  </style>
</head>
<body>
  <h2>Driver Ride Test</h2>

  <fieldset>
    <legend>Connection</legend>
    <label for="socketUrl">Socket URL</label>
    <input id="socketUrl" value="http://localhost:4022" />
    <div>
      <button id="connectBtn">Connect</button>
      <button id="disconnectBtn">Disconnect</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>Ride Context</legend>
    <label for="rideId">Ride ID</label>
    <input id="rideId" value="ride-123" />
    <label for="driverId">Driver ID</label>
    <input id="driverId" value="driver-1" />
    <div>
      <button id="subscribeBtn">Subscribe (join room)</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>Location</legend>
    <label for="lat">Latitude</label>
    <input id="lat" type="number" step="0.000001" value="12.9716" />
    <label for="lng">Longitude</label>
    <input id="lng" type="number" step="0.000001" value="77.5946" />
    <label for="poly">Encoded Polyline (optional)</label>
    <input id="poly" />
    <div>
      <button id="sendLocBtn">Send One Location</button>
      <button id="startLocBtn">Start Location Interval (2s)</button>
      <button id="stopLocBtn">Stop Location Interval</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>Live Fare</legend>
    <label for="baseFare">Base Fare</label>
    <input id="baseFare" type="number" step="0.01" value="50" />
    <label for="perKm">Per Km Rate</label>
    <input id="perKm" type="number" step="0.01" value="12" />
    <label for="perMin">Per Minute Rate</label>
    <input id="perMin" type="number" step="0.01" value="2" />
    <label for="weatherMul">Weather Multiplier</label>
    <input id="weatherMul" type="number" step="0.1" value="1" />
    <label for="surgeMul">Surge Multiplier</label>
    <input id="surgeMul" type="number" step="0.1" value="1" />
    <div>
      <button id="sendFareBtn">Send Fare Tick</button>
      <button id="sendFareEndBtn">Send Fare Ended</button>
      <button id="sendFareDelayedBtn">Send Fare Tick After 15s</button>
      <button id="cancelFareDelayedBtn">Cancel Delayed Fare</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>Status & Cancellation</legend>
    <label for="statusSel">Ride Status</label>
    <select id="statusSel">
      <option>REQUESTED</option>
      <option selected>ACCEPTED</option>
      <option>DRIVER_ARRIVING</option>
      <option>STARTED</option>
      <option>COMPLETED</option>
      <option>CANCELLED_BY_DRIVER</option>
      <option>CANCELLED_BY_PASSENGER</option>
      <option>EXPIRED</option>
    </select>
    <label for="reason">Reason (optional)</label>
    <input id="reason" />
    <div>
      <button id="setStatusBtn">Set Ride Status</button>
      <button id="cancelRideBtn">Driver Cancel Ride (legacy)</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>Logs</legend>
    <div id="log"></div>
  </fieldset>

  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script>
    let socket;
    let locTimer = null;
    let fareDelayTimer = null; // holds the 15s delayed fare/location

    function log(...args) {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      line.textContent = args.map(a => (typeof a === 'string' ? a : JSON.stringify(a))).join(' ');
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
      console.log(...args);
    }

    function getCtx() {
      return {
        url: document.getElementById('socketUrl').value.trim(),
        rideId: document.getElementById('rideId').value.trim(),
        driverId: document.getElementById('driverId').value.trim(),
        lat: parseFloat(document.getElementById('lat').value),
        lng: parseFloat(document.getElementById('lng').value),
        poly: document.getElementById('poly').value.trim(),
        baseFare: parseFloat(document.getElementById('baseFare').value),
        perKm: parseFloat(document.getElementById('perKm').value),
        perMin: parseFloat(document.getElementById('perMin').value),
        weather: parseFloat(document.getElementById('weatherMul').value),
        surge: parseFloat(document.getElementById('surgeMul').value),
        reason: document.getElementById('reason').value.trim(),
        status: document.getElementById('statusSel').value,
      };
    }

    function wireListeners() {
      socket.on('connect', () => log('connected', socket.id));
      socket.on('disconnect', () => log('disconnected'));

      // Unified stream
      socket.on('rideStream', (evt) => log('rideStream ←', evt));

      // Legacy listeners (for comparison)
      socket.on('locationUpdateFromDriver', (d) => log('locationUpdateFromDriver ←', d));
      socket.on('rideStatusUpdate', (d) => log('rideStatusUpdate ←', d));
      socket.on('liveFareUpdate', (d) => log('liveFareUpdate ←', d));
    }

    document.getElementById('connectBtn').onclick = () => {
      const { url } = getCtx();
      socket = io(url, { transports: ['websocket'] });
      wireListeners();
    };

    document.getElementById('disconnectBtn').onclick = () => {
      if (locTimer) { clearInterval(locTimer); locTimer = null; }
      if (fareDelayTimer) { clearTimeout(fareDelayTimer); fareDelayTimer = null; }
      if (socket) socket.disconnect();
    };

    document.getElementById('subscribeBtn').onclick = () => {
      const { rideId } = getCtx();
      socket.emit('subscribe', { rideId });
      log('subscribe →', { rideId });
    };

    document.getElementById('sendLocBtn').onclick = () => {
      const { rideId, driverId, lat, lng, poly } = getCtx();
      const payload = { rideId, driverId, lat, lng };
      if (poly) payload.encodedPolyline = poly;
      socket.emit('locationUpdateFromDriver', payload);
      log('locationUpdateFromDriver →', payload);
    };

    document.getElementById('startLocBtn').onclick = () => {
      if (locTimer) return;
      locTimer = setInterval(() => {
        const { rideId, driverId } = getCtx();
        // Nudge lat/lng slightly to simulate movement
        const latEl = document.getElementById('lat');
        const lngEl = document.getElementById('lng');
        latEl.value = (parseFloat(latEl.value) + 0.0003).toFixed(6);
        lngEl.value = (parseFloat(lngEl.value) + 0.0003).toFixed(6);
        const lat = parseFloat(latEl.value);
        const lng = parseFloat(lngEl.value);
        socket.emit('locationUpdateFromDriver', { rideId, driverId, lat, lng });
        log('locationUpdateFromDriver →', { rideId, driverId, lat, lng });
      }, 2000);
      log('Started location interval');
    };

    document.getElementById('stopLocBtn').onclick = () => {
      if (locTimer) { clearInterval(locTimer); locTimer = null; log('Stopped location interval'); }
    };

    document.getElementById('sendFareBtn').onclick = () => {
      const { rideId, lat, lng, baseFare, perKm, perMin, weather, surge } = getCtx();
      socket.emit('liveFareUpdate', {
        rideId,
        coordinates: { lat, lng },
        timestamp: Date.now(),
        baseFare,
        perKmRate: perKm,
        perMinuteRate: perMin,
        weatherMultiplier: weather,
        surgeMultiplier: surge,
      });
      log('liveFareUpdate → tick');
    };

    document.getElementById('sendFareEndBtn').onclick = () => {
      const { rideId, lat, lng, baseFare, perKm, perMin, weather, surge } = getCtx();
      socket.emit('liveFareUpdate', {
        rideId,
        coordinates: { lat, lng },
        timestamp: Date.now(),
        baseFare,
        perKmRate: perKm,
        perMinuteRate: perMin,
        weatherMultiplier: weather,
        surgeMultiplier: surge,
        status: 'ended',
      });
      log('liveFareUpdate → ended');
    };

    // New: schedule a location + live fare tick after 15 seconds
    document.getElementById('sendFareDelayedBtn').onclick = () => {
      if (fareDelayTimer) { clearTimeout(fareDelayTimer); fareDelayTimer = null; }
      const { rideId, driverId, lat, lng, baseFare, perKm, perMin, weather, surge } = getCtx();
      log('Scheduled delayed fare tick and location (15s) →', { rideId, driverId });

      fareDelayTimer = setTimeout(() => {
        const locPayload = { rideId, driverId, lat, lng };
        socket.emit('locationUpdateFromDriver', locPayload);
        log('locationUpdateFromDriver (delayed 15s) →', locPayload);

        const farePayload = {
          rideId,
          coordinates: { lat, lng },
          timestamp: Date.now(),
          baseFare,
          perKmRate: perKm,
          perMinuteRate: perMin,
          weatherMultiplier: weather,
          surgeMultiplier: surge,
        };
        socket.emit('liveFareUpdate', farePayload);
        log('liveFareUpdate (delayed 15s) → tick');

        fareDelayTimer = null;
      }, 15000);
    };

    // Optional: cancel the pending delayed fare/location
    document.getElementById('cancelFareDelayedBtn').onclick = () => {
      if (fareDelayTimer) {
        clearTimeout(fareDelayTimer);
        fareDelayTimer = null;
        log('Cancelled delayed fare/location timer');
      }
    };

    document.getElementById('setStatusBtn').onclick = () => {
      const { rideId, status, reason } = getCtx();
      socket.emit('setRideStatus', { rideId, status, reason });
      log('setRideStatus →', { rideId, status, reason });
    };

    document.getElementById('cancelRideBtn').onclick = () => {
      const { rideId, reason } = getCtx();
      socket.emit('driverCanceledRide', { rideId, reason });
      log('driverCanceledRide →', { rideId, reason });
    };
  </script>
</body>
</html>
