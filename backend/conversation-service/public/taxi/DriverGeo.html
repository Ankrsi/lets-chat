<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Geo Update Tester (Multi-Driver, Multi-Socket)</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #0b1020;
      color: #e7ebff;
    }

    .card {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px;
      background: #121737;
      border: 1px solid #2a2f53;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
    }

    h1 {
      margin-bottom: 16px;
    }

    label {
      font-size: 12px;
      color: #9fb0ff;
      display: block;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #2a2f53;
      background: #0d1230;
      color: #e7ebff;
    }

    button {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #2a2f53;
      background: #1a2250;
      color: #e7ebff;
      cursor: pointer;
    }

    button.primary {
      background: #2b3aa3;
      border-color: #6e8cff;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .driver-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    #log {
      height: 300px;
      background: #0b1030;
      border-radius: 12px;
      padding: 12px;
      overflow: auto;
      white-space: pre-wrap;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🚕 Driver Geo Update Tester</h1>

    <!-- Socket + Token -->
    <div class="row">
      <div style="flex:1">
        <label>Socket URL</label>
        <!-- <input id="socketUrl" value="wss://superapp-event-service.testsdlc.in" /> -->
        <input id="socketUrl" value="http://localhost:4022" />
      </div>
      <div style="flex:2">
        <label>JWT Token</label>
        <input id="jwtToken" placeholder="Paste JWT token here" />
      </div>
    </div>

    <!-- Mode -->
    <div class="row">
      <div style="flex:1">
        <label>Mode</label>
        <select id="mode">
          <option value="direct">direct</option>
          <option value="kafka">kafka</option>
        </select>
      </div>
      <div style="flex:1">
        <label>Interval (seconds)</label>
        <input id="intervalSec" type="number" value="10" />
      </div>
      <div style="flex:1">
        <label>
          <input id="jitter" type="checkbox" /> Jitter
        </label>
      </div>
    </div>

    <!-- Drivers -->
    <div id="driversContainer"></div>
    <button id="addDriverBtn">➕ Add Driver</button>

    <!-- Actions -->
    <div class="row" style="margin-top:12px;">
      <button id="connectBtn" class="primary">Connect All</button>
      <button id="disconnectBtn">Disconnect All</button>
      <button id="sendOnceBtn">Send Once</button>
      <button id="startBtn">Start Auto</button>
      <button id="stopBtn">Stop Auto</button>
      <button id="clearLogBtn">Clear Log</button>
    </div>

    <!-- Logs -->
    <div id="log"></div>
  </div>

  <script>
    let drivers = [];

    const el = id => document.getElementById(id);
    const log = (msg, obj) => {
      el('log').textContent += msg + (obj ? "\n" + JSON.stringify(obj, null, 2) : "") + "\n\n";
      el('log').scrollTop = el('log').scrollHeight;
    };

    function createSocketForDriver(driver) {
      const url = el('socketUrl').value.trim();
      const token = el('jwtToken').value.trim();
      if (!url || !token) return alert('Socket URL & JWT required');

      driver.socket = io(url, {
        transports: ['websocket'],
        auth: { token }
      });

      driver.socket.on('connect', () => log(`✅ ${driver.id} connected`));
      driver.socket.on('disconnect', r => log(`⚠️ ${driver.id} disconnected`, r));
      driver.socket.on('connect_error', e => log(`❌ connect error`, e.message));
    }

    function emitForDriver(d) {
      if (!d.socket?.connected) {
        log(`⚠️ ${d.id} not connected`);
        return;
      }

      let lat = d.lat;
      let lng = d.lng;

      if (el('jitter').checked) {
        lat += (Math.random() - 0.5) * 0.0005;
        lng += (Math.random() - 0.5) * 0.0005;
      }

      const evt = el('mode').value === 'kafka'
        ? 'driverGeoUpdateKafka'
        : 'driverGeoUpdateDirect';

      const payload = {
        taxi_driver_id: d.id,
        lat,
        lng,
        ts: new Date().toISOString()
      };

      d.socket.emit(evt, payload);
      log(`📍 SENT [${evt}] → ${d.id}`, payload);
    }

    function connectAll() {
      drivers.forEach(d => (!d.socket || !d.socket.connected) && createSocketForDriver(d));
    }

    function startAutoAll() {
      const sec = Number(el('intervalSec').value);
      log(`▶️ Auto send started (${sec}s interval)`);

      drivers.forEach(d => {
        clearInterval(d.timer);
        d.timer = setInterval(() => emitForDriver(d), sec * 1000);
      });
    }

    function stopAutoAll() {
      drivers.forEach(d => clearInterval(d.timer));
      log('⏹️ Auto send stopped');
    }

    function addDriverRow(init = { id: '', lat: 19.07, lng: 72.87 }) {
      const row = document.createElement('div');
      row.className = 'driver-row';
      row.innerHTML = `
      <input placeholder="driverId" value="${init.id}">
      <input type="number" value="${init.lat}">
      <input type="number" value="${init.lng}">
    `;
      el('driversContainer').appendChild(row);

      const d = { ...init, row, socket: null, timer: null };
      drivers.push(d);

      row.querySelectorAll('input').forEach((i, idx) => {
        i.onchange = () => {
          d.id = row.children[0].value;
          d.lat = Number(row.children[1].value);
          d.lng = Number(row.children[2].value);
        };
      });
    }

    el('addDriverBtn').onclick = () =>
      addDriverRow({ id: `driver${drivers.length + 1}`, lat: 19.07, lng: 72.87 });

    el('connectBtn').onclick = connectAll;
    el('sendOnceBtn').onclick = () => drivers.forEach(emitForDriver);
    el('startBtn').onclick = startAutoAll;
    el('stopBtn').onclick = stopAutoAll;
    el('clearLogBtn').onclick = () => el('log').textContent = '';

    addDriverRow({ id: '694517b274120059836f384b', lat: 9.5754717, lng: -13.619882 });
  </script>
</body>

</html>
