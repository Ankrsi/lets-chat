<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Driver Pool Ride Tester</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-800">
  <div class="max-w-3xl mx-auto p-4 md:p-6">

    <!-- Header -->
    <header class="flex items-center justify-between mb-4">
      <h1 class="text-xl md:text-2xl font-semibold">🚗 Driver Pool Ride Tester</h1>
      <div id="connBadge" class="inline-flex items-center gap-2 rounded-full px-3 py-1 text-sm bg-slate-200 text-slate-700">
        🔴 Disconnected
      </div>
    </header>

    <section class="bg-white shadow-sm rounded-xl border border-slate-200">

      <!-- Connection Config -->
      <div class="p-4 border-b border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium mb-1">Socket URL</label>
          <input
            id="socketUrl"
            value="http://localhost:4022"
            class="w-full border rounded-lg px-3 py-2"
          />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Auth Token</label>
          <input
            id="token"
            placeholder="Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            class="w-full border rounded-lg px-3 py-2"
          />
        </div>
      </div>

      <!-- Payload -->
      <div class="p-4 border-b border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-sm font-medium mb-1">Request ID</label>
          <input id="requestId" value="REQ123" class="w-full border rounded-lg px-3 py-2" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Pool Ride ID</label>
          <input id="poolRideId" value="POOL456" class="w-full border rounded-lg px-3 py-2" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Status</label>
          <select id="status" class="w-full border rounded-lg px-3 py-2">
            <option value="accepted">accepted</option>
            <option value="started">started</option>
            <option value="completed">completed</option>
          </select>
        </div>
      </div>

      <!-- Actions -->
      <div class="p-4 flex gap-3">
        <button
          id="connectBtn"
          class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700">
          Connect
        </button>

        <button
          id="sendBtn"
          class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">
          Send Event
        </button>

        <button
          id="clearBtn"
          class="ml-auto text-slate-600 underline">
          Clear Logs
        </button>
      </div>

      <!-- Logs -->
      <div class="p-4 border-t border-slate-200">
        <h2 class="font-medium mb-2">Logs</h2>
        <div
          id="logs"
          class="h-80 overflow-auto border rounded-lg bg-slate-50 p-3 text-sm">
        </div>
      </div>

    </section>
  </div>

  <script>
    let socket;
    const logs = document.getElementById("logs");
    const connBadge = document.getElementById("connBadge");

    function log(msg, color = "text-slate-700") {
      logs.innerHTML += `<div class="${color}">${new Date().toLocaleTimeString()} → ${msg}</div>`;
      logs.scrollTop = logs.scrollHeight;
    }

    // Connect
    document.getElementById("connectBtn").addEventListener("click", () => {
      const url = document.getElementById("socketUrl").value.trim();
      const token = document.getElementById("token").value.trim();

      if (!url) {
        alert("Socket URL required");
        return;
      }

      if (socket) {
        socket.disconnect();
      }

      log(`🔌 Connecting to ${url}`);
      log(`🔐 Token sent: ${token ? "YES" : "NO"}`);

      socket = io(url, {
        transports: ["websocket"],
        auth: {
          token: token, // 👈 TOKEN PASSED HERE
        },
      });

      socket.on("connect", () => {
        connBadge.innerHTML = "🟢 Connected";
        log(`Connected | socket.id = ${socket.id}`, "text-emerald-700");
      });

      socket.on("disconnect", () => {
        connBadge.innerHTML = "🔴 Disconnected";
        log("Disconnected", "text-rose-700");
      });

      socket.onAny((event, data) => {
        log(`📥 ${event} → ${JSON.stringify(data)}`, "text-blue-700");
      });
    });

    // Emit Event
    document.getElementById("sendBtn").addEventListener("click", () => {
      if (!socket || !socket.connected) {
        log("❌ Socket not connected", "text-rose-700");
        return;
      }

      const payload = {
        requestId: document.getElementById("requestId").value.trim(),
        poolRideId: document.getElementById("poolRideId").value.trim(),
        status: document.getElementById("status").value,
      };

      socket.emit("driverAcceptedPoolRide", payload);
      log(`🚗 Emitted driverAcceptedPoolRide → ${JSON.stringify(payload)}`, "text-indigo-700");
    });

    // Clear logs
    document.getElementById("clearBtn").addEventListener("click", () => {
      logs.innerHTML = "";
    });
  </script>
</body>
</html>
