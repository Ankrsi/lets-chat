<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Driver Dashboard</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;padding:20px}
.dashboard{max-width:800px;margin:auto;background:white;padding:20px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,0.1)}
.section{margin-bottom:20px}
.input-group{display:flex;flex-wrap:wrap;gap:10px}
input{padding:8px;border:1px solid #ccc;border-radius:4px}
button{padding:10px 15px;background:#007bff;color:white;border:none;border-radius:4px;cursor:pointer}
button:hover{background:#0056b3}
button:disabled{background:#ccc;cursor:not-allowed}
.live-data{background:#e9ffe9;padding:15px;border-radius:8px;font-weight:bold;color:#28a745}
.logs{background:#f8f9fa;padding:10px;border-radius:4px;max-height:200px;overflow-y:auto}
</style>
</head>
<body>
<div class="dashboard">
<h1>Driver Dashboard</h1>

<!-- Join Ride -->
<div class="section">
<h2>Join Ride</h2>
<div class="input-group">
<label>Ride ID: <input id="rideId" value="test-ride-123"></label>
<button onclick="joinRide()">Join Ride</button>
</div>
</div>

<!-- Update Location & Fare -->
<div class="section">
<h2>Update Location & Fare</h2>
<div class="input-group">
<label>Lat: <input id="lat" value="9.5754717"></label>
<label>Lng: <input id="lng" value="-13.6198829"></label>
<label>Base Fare: <input id="baseFare" value="60"></label>
<label>Per KM: <input id="perKmRate" value="18"></label>
<label>Per Min: <input id="perMinuteRate" value="3.5"></label>
<label>Weather Mult: <input id="weatherMultiplier" value="1.2"></label>
<label>Surge Mult: <input id="surgeMultiplier" value="1"></label>
<label>Status: <input id="status" value="ongoing"></label>
</div>
<button id="autoBtn" onclick="toggleAutoSend()">Start Auto-Send (5s)</button>
<button id="sendBtn" onclick="sendUpdate()">Send Manual Update</button>
</div>

<!-- DB Simulation -->
<div class="section">
<h2>DB Simulation</h2>
Updates sent: <span id="updateCount">0</span><br>
Last DB write: <span id="dbStatus">-</span><br>
<button onclick="endRide()">End Ride</button>
</div>

<!-- Live Fare -->
<div class="section">
<h2>Live Fare</h2>
<div id="liveData" class="live-data">Waiting...</div>
</div>

<!-- Logs -->
<div class="section">
<h2>Logs</h2>
<div id="logs" class="logs"></div>
<button onclick="clearLogs()">Clear Logs</button>
</div>
</div>

<script>
const socket = io('http://localhost:4022'); // adjust your backend URL
let autoSendInterval = null, sentCount = 0, rideEnded = false;

socket.on('connect', () => log('Connected to server'));
socket.on('liveFareUpdate', (data) => updateLiveData(data));

function joinRide(){
  const rideId = document.getElementById('rideId').value;
  socket.emit('subscribe', { rideId });
  log(`Joined ride ${rideId}`);
}

function getPayload(lat, lng, statusOverride=null){
  return {
    rideId: document.getElementById('rideId').value,
    coordinates: { lat, lng },
    timestamp: Date.now(),
    baseFare: parseFloat(document.getElementById('baseFare').value),
    perKmRate: parseFloat(document.getElementById('perKmRate').value),
    perMinuteRate: parseFloat(document.getElementById('perMinuteRate').value),
    weatherMultiplier: parseFloat(document.getElementById('weatherMultiplier').value),
    surgeMultiplier: parseFloat(document.getElementById('surgeMultiplier').value),
    status: statusOverride || document.getElementById('status').value
  };
}

function sendUpdate(statusOverride=null){
  if(rideEnded && !statusOverride){ log("Ride has ended."); return; }

  let lat = parseFloat(document.getElementById('lat').value);
  let lng = parseFloat(document.getElementById('lng').value);

  const data = getPayload(lat, lng, statusOverride);
  socket.emit('liveFareUpdate', data);

  sentCount++;
  document.getElementById('updateCount').innerText = sentCount;
  log(`Sent update #${sentCount} (${lat},${lng}) status: ${data.status}`);

  const status = data.status.toLowerCase();
  if(sentCount % 10 === 0 || ["ended","completed","cancelled","finished"].includes(status))
    document.getElementById('dbStatus').innerText = `DB write triggered (update #${sentCount})`;

  // Auto-move location
  if(!statusOverride){
    document.getElementById('lat').value = (lat + 0.005).toFixed(4);
    document.getElementById('lng').value = (lng + 0.005).toFixed(4);
  }
}

function toggleAutoSend(){
  if(rideEnded){ log("Ride ended, cannot start auto-send."); return; }
  if(autoSendInterval){
    clearInterval(autoSendInterval);
    autoSendInterval = null;
    document.getElementById("autoBtn").innerText = "Start Auto-Send (5s)";
    log("Auto-send stopped");
  } else{
    sendUpdate();
    autoSendInterval = setInterval(sendUpdate, 5000);
    document.getElementById("autoBtn").innerText = "Stop Auto-Send";
    log("Auto-send started (5s)");
  }
}

function endRide(){
  rideEnded = true;
  document.getElementById('status').value = 'ended';

  // Send one final update with "ended" status
  sendUpdate("ended");

  if(autoSendInterval){ clearInterval(autoSendInterval); autoSendInterval=null; document.getElementById("autoBtn").innerText="Start Auto-Send (5s)"; }
  document.getElementById("sendBtn").disabled = true;
  document.getElementById("autoBtn").disabled = true;
  log("Ride ended → final DB write triggered");
}

function updateLiveData(data){
  document.getElementById('liveData').innerHTML =
    `Fare: ₹${data.currentFare}<br>Distance: ${data.totalDistance.toFixed(2)} km<br>Time: ${data.totalTime.toFixed(2)} min<br>Status: ${data.status}`;
}

function log(msg){
  document.getElementById('logs').innerHTML += `<p>${msg}</p>`;
  document.getElementById('logs').scrollTop = document.getElementById('logs').scrollHeight;
}

function clearLogs(){ document.getElementById('logs').innerHTML = ''; }
</script>
</body>
</html>
