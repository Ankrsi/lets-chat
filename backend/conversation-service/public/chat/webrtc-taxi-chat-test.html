<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Taxi Chat Tester</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input,
        button {
            margin: 5px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            cursor: pointer;
            background-color: #007bff;
            color: #fff;
            border: none;
        }

        button.secondary {
            background-color: #28a745;
        }

        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        #log {
            background: #111;
            color: #0f0;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
        }

        .row {
            margin-bottom: 10px;
        }

        .small {
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🚖 Taxi Chat Tester</h2>

        <h3>1) register User (via WebSocket)</h3>
        <div class="row">
            <label class="small">Socket URL:</label>
            <!-- <input id="serverUrl" type="text" value="http://89.116.121.48:4022" style="min-width:260px" /> -->
            <!-- <input id="serverUrl" type="text" value="wss://superapp-event-service.testsdlc.in" style="min-width:260px" /> -->
            <input id="serverUrl" type="text" value="http://localhost:4022" style="min-width:260px" />
            <label class="small">Username:</label>
            <input id="username" type="text" placeholder="user123" />
            <button id="connectBtn">Connect</button>
        </div>

        <hr />

        <h3>2) Create Conversation (via REST API)</h3>
        <div class="row">
            <label class="small">API Base:</label>
            <input id="apiBase" type="text" value="http://localhost:4021/api/v1/chats/taxiCreateConversation" style="min-width:260px" />
            <!-- <input id="apiBase" type="text" value="http://89.116.121.48:4021/api/v1/chats/taxiCreateConversation" style="min-width:260px" /> -->
            <!-- <input id="apiBase" type="text" value="https://superapp-event-service.testsdlc.in/api/v1/chats/taxiCreateConversation" style="min-width:260px" /> -->
            <label class="small">Member IDs (comma-separated):</label>
            <input id="memberIds" type="text" placeholder="user1,user2" /><br />
            <label class="small">Booking Id:</label>
            <input id="createBookingId" type="text" placeholder="bookingId" />
            <button id="createConvBtn" class="secondary">Create Conversation (API)</button>
        </div>

        <hr />

        <h3>3) Join Room (via WebSocket)</h3>
        <div class="row">
            <label class="small">Booking ID:</label>
            <input id="bookingId" type="text" placeholder="booking123" />
            <button id="joinBtn">Join Room</button>
        </div>

        <hr />

        <h3>4) Send Message (via WebSocket)</h3>
        <div class="row">
            <input id="message" type="text" placeholder="Type message..." style="width:70%" />
            <button id="sendBtn">Send Message</button>
        </div>

        <hr />

        <h3>5) Check Online Status (via WebSocket) (optional)</h3>
        <div class="row">
            <button id="onlineBtn">Check isOnline</button>
        </div>

        <hr />
        <h3>📜 Logs</h3>
        <div id="log"></div>
    </div>

    <script>
        let socket;

        const $ = (id) => document.getElementById(id);
        const log = (...args) => {
            const div = $('log');
            div.innerHTML += `<div>${new Date().toLocaleTimeString()} → ${args.map(a =>
                typeof a === 'object' ? JSON.stringify(a) : a
            ).join(' ')}</div>`;
            div.scrollTop = div.scrollHeight;
            console.log(...args);
        };

        $('connectBtn').addEventListener('click', () => {
            const serverUrl = $('serverUrl').value;
            const username = $('username').value;
            if (!serverUrl || !username) return alert('Enter server URL and username');
            const token = "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImFjY2Vzcy1rZXktMSJ9.eyJzdWIiOiI2OTdjYzA5NDgyMTliOWEwOTdhZTc5N2EiLCJfaWQiOiI2OTdjYzA5NDgyMTliOWEwOTdhZTc5N2EiLCJyb2xlIjoidGF4aV9kcml2ZXIiLCJlbWFpbCI6Imdlc2FzaXgzMjhAZ2FtZW5pbmcuY29tIiwicGhvbmUiOjkxOTY2NzAzNTkyNiwid2FsbGV0X2lkIjoiOTE5NjY3MDM1OTI2LVpEOUdCQHd0YXhpIiwiYXBwX2NvZGUiOiJOR19UQkEiLCJpYXQiOjE3NzAxMTQ2NjMsImV4cCI6MTc3MDIwMTA2MywiaXNzIjoiYXV0aC5zdXBlcmFwcCJ9.BKNW2TnurV_24X7uqT_sE1pXLXzYKDzBtq9lkDgtGk_25w38bHY4tJuYdvMCWdr6cme6b8PZ1iKmCywy-USwN9OeKMWO9CFM_2OyagDk9DrNScqtLdcnwfQRpkEDUg6awAmTUz4_lC4Ef28JTjIIgEX3Q6SUzQI7l43fnDZlhIkweKsLGeh5jqpSvZcqNzxeaQ_CqnvmGd3ISqxZ_B0XWPKVDoA595INhDJu-P3EGU3Q62EAg1jrtaMVz8tEyR2CfyEeLA1YTmdUb1rmF_DifXrML_Lrd9SHuN6GhMrxdKm1tW58eGmDeP06MvcemVXARCXcDqIG9LaWUdyAxHm4OQ";
            socket = io(serverUrl, {
                transports: ["websocket"],
                auth: { token },
                reconnection: true,
                reconnectionAttempts: Infinity,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000,
                forceNew: false,
            });
            socket.on('connect', () => {
                log('✅ Connected to', serverUrl);
                socket.emit('taxi:registerUser', { username });
                socket.emit('taxi:conversations', { username });
            });

            socket.on('taxi:history', (history) => log('📜 History:', history));
            socket.on('taxi:recv-more-history', (data) => log('📜 More History:', data));
            socket.on('taxi:conversationList', (data) => log('💬 Conversations:', data));
            socket.on('taxi:conversationListUpdate', (data) => log('🔄 ConvListUpdate:', data));
            socket.on('taxi:recv-message', (msg) => log('📩 New Message:', msg));

            socket.on('disconnect', () => log('❌ Disconnected'));
        });

        $('joinBtn').addEventListener('click', () => {
            if (!socket) return alert('Connect first');
            const bookingId = $('bookingId').value;
            const username = $('username').value;
            socket.emit('taxi:join', { bookingId, username });
            log('🚪 Joined room', bookingId);
        });

        $('sendBtn').addEventListener('click', () => {
            if (!socket) return alert('Connect first');
            const bookingId = $('bookingId').value;
            const senderId = $('username').value;
            const content = $('message').value;
            const timestamp = Date.now();

            socket.emit('taxi:send-message', {
                bookingId,
                senderId,
                messageType: 'text',
                content,
                timestamp
            });
            $('message').value = '';
            log('📤 Sent message:', content);
        });

        $('onlineBtn').addEventListener('click', () => {
            if (!socket) return alert('Connect first');
            const username = $('username').value;
            socket.emit('taxi:isOnline', { username });
            log('🟢 isOnline ping');
        });

        // ✅ Create conversation via REST API
        $('createConvBtn').addEventListener('click', async () => {
            const apiBase = $('apiBase').value.trim();
            const bookingId = $('createBookingId').value.trim();
            const members = $('memberIds').value.split(',').map(m => m.trim()).filter(Boolean);

            if (!apiBase || members.length === 0)
                return alert('Please fill API base, memberIds, and bookingId');

            try {
                const res = await fetch(`${apiBase}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImFjY2Vzcy1rZXktMSJ9.eyJzdWIiOiI2OTdjYzA5NDgyMTliOWEwOTdhZTc5N2EiLCJfaWQiOiI2OTdjYzA5NDgyMTliOWEwOTdhZTc5N2EiLCJyb2xlIjoidGF4aV9kcml2ZXIiLCJlbWFpbCI6Imdlc2FzaXgzMjhAZ2FtZW5pbmcuY29tIiwicGhvbmUiOjkxOTY2NzAzNTkyNiwid2FsbGV0X2lkIjoiOTE5NjY3MDM1OTI2LVpEOUdCQHd0YXhpIiwiYXBwX2NvZGUiOiJOR19UQkEiLCJpYXQiOjE3NzAxMTQ2NjMsImV4cCI6MTc3MDIwMTA2MywiaXNzIjoiYXV0aC5zdXBlcmFwcCJ9.BKNW2TnurV_24X7uqT_sE1pXLXzYKDzBtq9lkDgtGk_25w38bHY4tJuYdvMCWdr6cme6b8PZ1iKmCywy-USwN9OeKMWO9CFM_2OyagDk9DrNScqtLdcnwfQRpkEDUg6awAmTUz4_lC4Ef28JTjIIgEX3Q6SUzQI7l43fnDZlhIkweKsLGeh5jqpSvZcqNzxeaQ_CqnvmGd3ISqxZ_B0XWPKVDoA595INhDJu-P3EGU3Q62EAg1jrtaMVz8tEyR2CfyEeLA1YTmdUb1rmF_DifXrML_Lrd9SHuN6GhMrxdKm1tW58eGmDeP06MvcemVXARCXcDqIG9LaWUdyAxHm4OQ`
                    },
                    body: JSON.stringify({ memberIds: members, bookingId })
                });

                const data = await res.json();
                log('🌐 createConversation →', data);
                alert(data.message || 'Conversation created');
            } catch (err) {
                log('❌ API error', err);
                alert('Failed to create conversation');
            }
        });
    </script>
</body>

</html>
